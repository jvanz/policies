name: Auto label

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  autolabeler:
    # Skip fork PRs — the GITHUB_TOKEN is read-only and cannot add labels
    if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      # The labelling action lives in this repository and reads the shared
      # conventional-commit parser from hack/, so the tree has to be present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/label-pr-by-title
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
