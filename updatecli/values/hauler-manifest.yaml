scm:
  enabled: true
  kind: "github"
  owner: "UPDATECLI_GITHUB_OWNER"
  repository: "policies"
  env_token: "UPDATECLI_GITHUB_TOKEN"
  branch: "main"
  user: "Kubewarden bot"
  email: "cncf-kubewarden-maintainers@lists.cncf.io"
  commitusingapi: true
  commitmessage:
    type: "chore"
    scope: "deps"
    title: "Update Hauler manifest with published policy versions"
    footers: "Signed-off-by: Kubewarden bot <cncf-kubewarden-maintainers@lists.cncf.io>"

pr:
  enabled: true
  automerge: false
  mergemethod: "squash"
  title: "chore(deps): Update Hauler manifest"
  description: |
    Automatic update of `hauler_manifest.yaml` with the latest published
    Kubewarden policy versions read from the OCI registry.

    This PR has been created by automation.
  labels:
    - "kind/chore"
    - "area/dependencies"
  reviewers:
    - "kubewarden/kubewarden-developers"

pipeline:
  labels:
    ecosystem: "hauler"
    policy: "manifest"
