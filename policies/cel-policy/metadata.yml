rules:
  - apiGroups:
      - ''
    apiVersions:
      - v1
    resources:
      - '*'
    operations:
      - CREATE
      - UPDATE
      - DELETE
mutating: false
contextAwareResources:
  - apiVersion: v1
    kind: Namespace
hostCapabilities:
  - crypto/v1/is_certificate_trusted
  - kubernetes/get_resource
  - kubernetes/list_resources_all
  - kubernetes/list_resources_by_namespace
  - net/v1/dns_lookup_host
  - oci/v1/manifest_digest
  - oci/v1/oci_manifest
  - oci/v1/oci_manifest_config
  - oci/v1/verify
  - oci/v2/verify
executionMode: wasi
backgroundAudit: true
annotations:
  io.kubewarden.policy.title: cel-policy
  io.kubewarden.policy.version: 1.6.5
  io.artifacthub.displayName: CEL Policy
  io.artifacthub.resources: Any
  io.artifacthub.keywords: compliance, CEL, ValidatingAdmissionPolicy, Common Expression Language
  io.kubewarden.policy.description: A policy that evaluates CEL expressions
  io.kubewarden.policy.author: Kubewarden developers <cncf-kubewarden-maintainers@lists.cncf.io>
  io.kubewarden.policy.ociUrl: ghcr.io/kubewarden/policies/cel-policy
  io.kubewarden.policy.url: https://github.com/kubewarden/policies
  io.kubewarden.policy.source: https://github.com/kubewarden/policies
  io.kubewarden.policy.license: Apache-2.0
  com.github.release.tag: cel-policy/v1.6.4
