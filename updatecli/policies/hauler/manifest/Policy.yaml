description: |
  Reconciles a Hauler content manifest (Images, Charts and Files documents,
  apiVersion content.hauler.cattle.io/v1) against a declarative desired
  state: missing documents and items are created, existing ones are updated
  in place, comments and unrelated documents are preserved, and per-item
  cosign keyless verification fields can be configured. Generic: carries no
  project-specific data, so the same policy can be reused across any
  repository maintaining a Hauler manifest.
