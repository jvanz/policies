# {{ if and .scm.enabled ( eq .scm.kind "githubsearch" ) }}
# {{ $GitHubUser := env "GITHUB_ACTOR" }}
# {{ $GitHubUsername := env "GITHUB_ACTOR" }}
# {{ $GitHubPAT := env .scm.env_token }}
scms:
  default:
    kind: "githubsearch"
    spec:
      user: "{{ default $GitHubUser .scm.user }}"
      # {{ if .scm.email }}
      email: "{{ .scm.email }}"
      # {{ end }}
      search: "{{ .scm.search }}"
      # {{ if kindIs "int" .scm.limit }}
      limit: {{ .scm.limit }}
      # {{ end }}
      token: "{{ default $GitHubPAT .scm.token }}"
      username: "{{ default $GitHubUsername .scm.username }}"
      branch: "{{ .scm.branch }}"
      # {{ if .scm.commitusingapi }}
      commitusingapi: {{ .scm.commitusingapi }}
      # {{ end }}
      # {{ if .scm.url }}
      url: "{{ .scm.url }}"
      # {{ end }}
      # {{ if .scm.commitmessage }}
      commitmessage:
        type: "{{ .scm.commitmessage.type }}"
        scope: "{{ .scm.commitmessage.scope }}"
        title: "{{ .scm.commitmessage.title }}"
        hidecredit: true
        # {{ if .scm.commitmessage.footers }}
        footers: "{{ .scm.commitmessage.footers }}"
        # {{ end }}
      # {{ end }}
# {{ if .pr.enabled }}
actions:
  default:
    title: "{{ .pr.title }}"
    kind: "github/pullrequest"
    scmid: "default"
    spec:
      automerge: {{ .pr.automerge | default false }}
      mergemethod: "{{ .pr.mergemethod | default "squash" }}"
      draft: {{ .pr.draft | default false }}
      # {{ if .pr.description }}
      description: |
        {{ .pr.description | nindent 8 }}
      # {{ end }}
      # {{ if .pr.reviewers }}
      reviewers:
        # {{ range .pr.reviewers }}
        - "{{ . }}"
        # {{ end }}
      # {{ end }}
      # {{ if .pr.labels }}
      labels:
        # {{ range .pr.labels }}
        - "{{ . }}"
        # {{ end }}
      # {{ end }}
# {{ end }}
# {{ end }}
